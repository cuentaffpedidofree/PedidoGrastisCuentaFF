<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Cuentas Free Fire</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }

        h1, h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #94a3b8;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0369a1;
        }

        .nav-btn {
            background-color: #334155;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }

        .card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background-color: #0369a1;
            border-radius: 4px;
            font-size: 12px;
        }

        .badge-region {
            background-color: #d97706;
        }

        .alert {
            padding: 10px;
            background-color: #15803d;
            color: white;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .chat-box {
            max-height: 200px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            margin-bottom: 10px;
        }

        .chat-msg {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .msg-user {
            background-color: #1e293b;
            border-left: 3px solid #38bdf8;
        }

        .msg-admin {
            background-color: #0369a1;
            border-left: 3px solid #f59e0b;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- VISTA 1: PEDIR CUENTA (PÚBLICO) -->
    <div id="public-section">
        <h1>Pedir Cuenta Free Fire</h1>
        
        <div id="success-alert" class="alert hidden">
            ¡Solicitud enviada! Revisa el chat abajo para hablar con el creador.
        </div>

        <form id="request-form">
            <div class="form-group">
                <label for="username">Tu Nombre / Apodo:</label>
                <input type="text" id="username" required placeholder="Ej. Diego">
            </div>

            <div class="form-group">
                <label for="account-name">Nombre deseado para la cuenta:</label>
                <input type="text" id="account-name" required placeholder="Ej. ProPlayer2026">
            </div>

            <div class="form-group">
                <label for="region">Selecciona la Región:</label>
                <select id="region" required>
                    <option value="Indonesia">Indonesia 🇮🇩</option>
                    <option value="EE.UU. (US)">EE.UU. (US) 🇺🇸</option>
                    <option value="Sudamérica (SAC)">Sudamérica (SAC) 🌎</option>
                    <option value="Europa">Europa 🇪🇺</option>
                    <option value="Brasil">Brasil 🇧🇷</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pack">Tipo de Cuenta / Pack:</label>
                <select id="pack" required>
                    <option value="Pack Indonesia Chetada">Pack Indonesia (Cuenta Chetada)</option>
                    <option value="Pack VIP Exclusivo">Pack VIP Exclusivo</option>
                    <option value="Cuenta Básica Gratis">Cuenta Básica Gratis</option>
                </select>
            </div>

            <button type="submit">Pedir Cuenta</button>
        </form>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- SECCIÓN DE CHAT / ESCRIBIRME -->
        <h2>Escribir al Creador</h2>
        <div id="user-chat-box" class="chat-box">
            <!-- Mensajes del chat público -->
        </div>

        <form id="chat-form">
            <div class="form-group">
                <input type="text" id="chat-sender" placeholder="Tu Nombre" required style="margin-bottom: 5px;">
                <input type="text" id="chat-message" placeholder="Escribe un mensaje al creador..." required>
            </div>
            <button type="submit" style="background-color: #059669;">Enviar Mensaje</button>
        </form>

        <span class="admin-link" onclick="showAdminLogin()">Acceso Privado Creador</span>
    </div>

    <!-- VISTA 2: LOGIN ADMINISTRADOR -->
    <div id="admin-login-section" class="hidden">
        <h2>Panel de Acceso</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="admin-user">Usuario:</label>
                <input type="text" id="admin-user" required placeholder="Usuario">
            </div>
            <div class="form-group">
                <label for="admin-pass">Contraseña:</label>
                <input type="password" id="admin-pass" required placeholder="Contraseña">
            </div>
            <button type="submit">Iniciar Sesión</button>
            <button type="button" class="nav-btn" onclick="showPublicForm()">Volver</button>
        </form>
    </div>

    <!-- VISTA 3: PANEL DEL CREADOR (ADMIN) -->
    <div id="admin-panel-section" class="hidden">
        <h2>Panel del Creador</h2>

        <!-- SOLICITUDES RECIBIDAS -->
        <h3 style="color: #38bdf8; margin-bottom: 10px; font-size: 16px;">Cuentas Pedidas:</h3>
        <div id="requests-list"></div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- MENSAJES DEL CHAT -->
        <h3 style="color: #38bdf8; margin-bottom: 10px; font-size: 16px;">Mensajes de Usuarios:</h3>
        <div id="admin-chat-box" class="chat-box"></div>

        <form id="admin-reply-form" style="margin-bottom: 15px;">
            <input type="text" id="reply-msg" placeholder="Responder en el chat público..." required style="margin-bottom: 5px;">
            <button type="submit" style="background-color: #d97706;">Responder Mensaje</button>
        </form>

        <button onclick="logoutAdmin()" style="background-color: #b91c1c;">Cerrar Sesión</button>
    </div>

</div>

<script>
    // Credenciales del Administrador
    const ADMIN_USER = "endry";
    const ADMIN_PASS = "1234";

    // Elementos DOM
    const publicSection = document.getElementById('public-section');
    const adminLoginSection = document.getElementById('admin-login-section');
    const adminPanelSection = document.getElementById('admin-panel-section');
    const requestForm = document.getElementById('request-form');
    const loginForm = document.getElementById('login-form');
    const chatForm = document.getElementById('chat-form');
    const adminReplyForm = document.getElementById('admin-reply-form');

    // Navegación
    function showAdminLogin() {
        publicSection.classList.add('hidden');
        adminLoginSection.classList.remove('hidden');
    }

    function showPublicForm() {
        adminLoginSection.classList.add('hidden');
        adminPanelSection.classList.add('hidden');
        publicSection.classList.remove('hidden');
    }

    // 1. Guardar Solicitud de Cuenta
    requestForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const newRequest = {
            id: Date.now(),
            user: document.getElementById('username').value,
            accountName: document.getElementById('account-name').value,
            region: document.getElementById('region').value,
            pack: document.getElementById('pack').value,
            date: new Date().toLocaleString()
        };

        let requests = JSON.parse(localStorage.getItem('ff_requests')) || [];
        requests.push(newRequest);
        localStorage.setItem('ff_requests', JSON.stringify(requests));

        requestForm.reset();
        document.getElementById('success-alert').classList.remove('hidden');

        setTimeout(() => {
            document.getElementById('success-alert').classList.add('hidden');
        }, 4000);
    });

    // 2. Sistema de Chat (Envío de mensajes de usuarios)
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const sender = document.getElementById('chat-sender').value;
        const msg = document.getElementById('chat-message').value;

        addChatMessage(sender, msg, 'user');
        document.getElementById('chat-message').value = '';
        renderChats();
    });

    // Respuesta del Administrador
    adminReplyForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = document.getElementById('reply-msg').value;

        addChatMessage('Creador (Endry)', msg, 'admin');
        document.getElementById('reply-msg').value = '';
        renderChats();
    });

    function addChatMessage(sender, text, type) {
        let chats = JSON.parse(localStorage.getItem('ff_chats')) || [];
        chats.push({ sender, text, type, time: new Date().toLocaleTimeString() });
        localStorage.setItem('ff_chats', JSON.stringify(chats));
    }

    function renderChats() {
        let chats = JSON.parse(localStorage.getItem('ff_chats')) || [];
        const userBox = document.getElementById('user-chat-box');
        const adminBox = document.getElementById('admin-chat-box');

        let html = '';
        if(chats.length === 0) {
            html = '<p style="font-size:12px; color:#64748b;">No hay mensajes aún.</p>';
        } else {
            chats.forEach(c => {
                html += `<div class="chat-msg ${c.type === 'admin' ? 'msg-admin' : 'msg-user'}">
                    <strong>${c.sender}:</strong> ${c.text}
                </div>`;
            });
        }

        userBox.innerHTML = html;
        adminBox.innerHTML = html;
        userBox.scrollTop = userBox.scrollHeight;
        adminBox.scrollTop = adminBox.scrollHeight;
    }

    // 3. Login de Creador
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('admin-user').value;
        const pass = document.getElementById('admin-pass').value;

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            adminLoginSection.classList.add('hidden');
            adminPanelSection.classList.remove('hidden');
            loadAdminData();
        } else {
            alert("Usuario o contraseña incorrectos.");
        }
    });

    function loadAdminData() {
        // Cargar Solicitudes
        const requestsList = document.getElementById('requests-list');
        requestsList.innerHTML = '';
        let requests = JSON.parse(localStorage.getItem('ff_requests')) || [];

        if (requests.length === 0) {
            requestsList.innerHTML = '<p style="color: #64748b; font-size:13px;">No hay cuentas pedidas pendientes.</p>';
        } else {
            requests.forEach((req) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <p><strong>Usuario:</strong> ${req.user}</p>
                    <p><strong>Nombre Cuenta:</strong> ${req.accountName}</p>
                    <p><strong>Región:</strong> <span class="badge badge-region">${req.region}</span></p>
                    <p><strong>Pack:</strong> <span class="badge">${req.pack}</span></p>
                    <p style="font-size:11px; color:#64748b; margin-top:5px;">${req.date}</p>
                    <button onclick="deleteRequest(${req.id})" style="background-color: #ef4444; padding: 5px; font-size: 12px; margin-top:8px;">Marcar como Entregada / Borrar</button>
                `;
                requestsList.appendChild(card);
            });
        }

        renderChats();
    }

    function deleteRequest(id) {
        let requests = JSON.parse(localStorage.getItem('ff_requests')) || [];
        requests = requests.filter(req => req.id !== id);
        localStorage.setItem('ff_requests', JSON.stringify(requests));
        loadAdminData();
    }

    function logoutAdmin() {
        adminPanelSection.classList.add('hidden');
        publicSection.classList.remove('hidden');
        loginForm.reset();
    }

    // Inicializar chat al cargar
    renderChats();
</script>

</body>
</html>
