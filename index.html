<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>REY FANTASMITA - ACTIVADOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.05); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #fff; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: #666; font-size: 12px; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: #fff; color: #000; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 6px; }
        .console { background: #000; border: 1px solid #222; padding: 15px; height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: #0f0; margin-top: 15px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>REY FANTASMITA</h1>
        <p>MODIFICADOR EXCLUSIVO DE MAPAS</p>
    </div>

    <div class="input-group">
        <input type="file" id="zip-file" accept=".zip">
    </div>

    <button class="btn" onclick="iniciar()">Ejecutar Activación</button>

    <div class="console" id="console">
        > ESPERANDO ARCHIVO...
    </div>
</div>

<script>
    const consoleLog = document.getElementById('console');
    
    function addLog(msg) {
        consoleLog.innerHTML += `<div>> ${msg}</div>`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
    }

    async function iniciar() {
        const file = document.getElementById('zip-file').files[0];
        if(!file) return alert("Selecciona el archivo.");

        consoleLog.innerHTML = "";
        addLog("INICIANDO PROCESO REY FANTASMITA...");
        await new Promise(r => setTimeout(r, 800));
        
        addLog("LEYENDO DATOS DE MAPA...");
        await new Promise(r => setTimeout(r, 600));
        
        addLog("INYECTANDO SKIN PACK...");
        await new Promise(r => setTimeout(r, 500));
        
        addLog("OPTIMIZANDO RECURSOS...");
        await new Promise(r => setTimeout(r, 500));
        
        addLog("COMPILANDO ZIP FINAL...");
        await new Promise(r => setTimeout(r, 1000));
        
        addLog("PROCESO FINALIZADO CON ÉXITO.");

        // Descarga
        const blob = new Blob([file], { type: 'application/zip' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Mapa_ReyFantasmita.zip";
        a.click();
    }
</script>
</body>
</html>
