<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF ENMANUEL ADM8 - PRO SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff4655; --gold: #fbbf24; --dark: #060913; }
        body { background: var(--dark); color: white; font-family: 'Rajdhani', sans-serif; text-align: center; padding: 10px; }
        .card { background: #0f172a; border-radius: 15px; padding: 20px; max-width: 450px; margin: 10px auto; border: 1px solid #334155; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-main { background: var(--primary); color: white; }
        .hidden { display: none !important; }
        .virtual-card { background: linear-gradient(135deg, #1e293b, #000); border: 2px solid var(--gold); border-radius: 15px; padding: 20px; margin: 15px 0; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="sec-login" class="card">
        <h1>FF ENMANUEL ADM8</h1>
        <input type="text" id="auth-name" placeholder="Tu Nombre de Jugador" style="width:90%; padding:10px; margin-bottom:10px;">
        <button class="btn btn-main" onclick="iniciarSesion()">ENTRAR AL SISTEMA</button>
    </div>

    <!-- MAIN LOBBY -->
    <div id="sec-main" class="hidden">
        <div class="card">
            <h2 id="welcome-msg">Bienvenido</h2>
            <div class="virtual-card">
                <p>SALDO DIAMANTES</p>
                <h1 id="ui-diamantes">0 💎</h1>
                <p id="ui-user" style="font-size:12px;"></p>
            </div>
            
            <button class="btn btn-gold" onclick="mostrar('sec-tienda')">💳 CANJEAR SUSCRIPCIONES</button>
            <button class="btn btn-main" onclick="toggleSonido()">🔊 TOGGLE SONIDO</button>
            <button id="btn-admin" class="btn" style="background:#8b5cf6;" onclick="mostrar('sec-admin')">👑 PANEL ENMANUEL ADM8</button>
        </div>
    </div>

    <!-- TIENDA / CANJE -->
    <div id="sec-tienda" class="card hidden">
        <h3>🛍️ TIENDA PRO</h3>
        <div class="card" style="border: 1px solid var(--gold);">
            <p>Suscripción VIP (Diamantes)</p>
            <button class="btn btn-gold" onclick="canjear(500)">CANJEAR 500 💎</button>
        </div>
        <button class="btn" onclick="mostrar('sec-main')">VOLVER</button>
    </div>

    <!-- PANEL ADMIN -->
    <div id="sec-admin" class="card hidden">
        <h3>👑 PANEL DE CONTROL</h3>
        <button class="btn btn-gold" onclick="darDiamantes(5000)">DAR +5000 DIAMANTES</button>
        <button class="btn" onclick="subirDuoMax()">⚡ SUBIR DÚO MÁXIMO</button>
        <button class="btn" onclick="mostrar('sec-main')">VOLVER</button>
    </div>

<script>
    let user = { name: "", balance: 1000 };
    let sonido = true;

    function iniciarSesion() {
        user.name = document.getElementById('auth-name').value;
        if(user.name.trim() === "") return alert("Nombre requerido");
        
        document.getElementById('sec-login').classList.add('hidden');
        document.getElementById('sec-main').classList.remove('hidden');
        document.getElementById('ui-user').innerText = "ID: " + user.name.toUpperCase();
        document.getElementById('welcome-msg').innerText = "Hola, " + user.name;
        
        // Verificación exclusiva
        if(user.name.toLowerCase() === "enmanuel adm8") {
            document.getElementById('btn-admin').classList.remove('hidden');
        } else {
            document.getElementById('btn-admin').classList.add('hidden');
        }
        actualizarUI();
    }

    function actualizarUI() {
        document.getElementById('ui-diamantes').innerText = user.balance + " 💎";
    }

    function canjear(costo) {
        if(user.balance >= costo) {
            user.balance -= costo;
            actualizarUI();
            alert("✅ Canje Exitoso");
        } else {
            alert("❌ Saldo insuficiente");
        }
    }

    function darDiamantes(cant) {
        user.balance += cant;
        actualizarUI();
    }

    function subirDuoMax() {
        alert("⚡ Dúo Dinámico configurado a NIVEL MÁXIMO");
    }

    function toggleSonido() {
        sonido = !sonido;
        alert(sonido ? "🔊 Efectos de Sonido ACTIVADOS" : "🔇 Efectos de Sonido DESACTIVADOS");
    }

    function mostrar(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
