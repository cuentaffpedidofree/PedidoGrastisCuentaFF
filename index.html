<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIFICADOR DE MAPAS - CREADOR 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background: #060d1a; color: white; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        
        .header-card { background: #0b1528; border: 1px solid #1e3a8a; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .title { color: #38bdf8; font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; }
        .subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }

        .section-box { background: #0b1528; border: 1px solid #1e3a8a; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

        input[type="file"] { width: 100%; padding: 10px; background: #060913; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 12px; margin-top: 5px; }
        
        .btn-modificar { width: 100%; padding: 14px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); border: none; border-radius: 8px; color: #ffffff; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-modificar:active { transform: scale(0.98); }

        .console-box { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; text-align: left; height: 220px; overflow-y: auto; margin-top: 10px; color: #38bdf8; }
        .console-line { margin-bottom: 4px; }
        
        .admin-badge { display: inline-block; background: linear-gradient(90deg, #f59e0b, #ef4444); padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 8px; border: 1px solid #fef08a; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-card">
        <div class="title">MODIFICADOR DE MAPAS</div>
        <div class="subtitle">PROYECTO OFICIAL ENMANUEL & ENDRY</div>
        <div><span class="admin-badge">👑 CREADOR 2 - ACCESO TOTAL</span></div>
    </div>

    <div class="section-box">
        <div class="section-title">📂 Seleccionar Archivo ZIP del Mapa</div>
        <input type="file" id="zip-file" accept=".zip">
        <button class="btn-modificar" onclick="iniciarModificacion()">⚡ INICIAR MODIFICACIÓN DE MAPA</button>
    </div>

    <div class="section-box">
        <div class="section-title">💻 CONSOLA DE PROCESAMIENTO</div>
        <div id="console-logs" class="console-box">
            <div class="console-line" style="color: #64748b;">> Sistema listo. Cargue el archivo del mapa...</div>
        </div>
    </div>

</div>

<script>
    const consoleBox = document.getElementById('console-logs');

    function logMsg(txt, color = "#38bdf8") {
        const div = document.createElement('div');
        div.className = 'console-line';
        div.style.color = color;
        div.innerText = "> " + txt;
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function iniciarModificacion() {
        const fileInput = document.getElementById('zip-file').files[0];
        if(!fileInput) return alert("Por favor selecciona un archivo ZIP.");

        consoleBox.innerHTML = "";
        
        logMsg("CARGANDO ARCHIVOS DE MAPA...", "#f59e0b");
        await new Promise(r => setTimeout(r, 800));

        logMsg("ANALIZANDO ESTRUCTURA: ProjectData_slot.bytes");
        logMsg("ANALIZANDO ESTRUCTURA: UserLevelData.bytes");
        await new Promise(r => setTimeout(r, 800));

        logMsg("INYECTANDO MODIFICACIONES DE MAPA:", "#ffffff");
        logMsg("• Aplicando texturas de ropa (Skin Pack)");
        await new Promise(r => setTimeout(r, 500));
        logMsg("• Optimizando estructuras de nivel");
        await new Promise(r => setTimeout(r, 500));
        logMsg("• Modificando archivos de skins de armas");
        await new Promise(r => setTimeout(r, 500));
        logMsg("• Aplicando cambios de accesorios de cabeza");
        await new Promise(r => setTimeout(r, 800));

        logMsg("COMPILANDO MAPA MODIFICADO...", "#f59e0b");
        await new Promise(r => setTimeout(r, 1000));
        
        logMsg("MODIFICACIÓN COMPLETADA CON ÉXITO", "#22c55e");
        logMsg("GENERANDO DESCARGA AUTOMÁTICA...", "#38bdf8");

        // Descarga
        setTimeout(() => {
            const blob = new Blob([fileInput], { type: 'application/zip' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Mapa_Modificado_Creador2.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            alert("✅ Mapa modificado y listo para usar.");
        }, 1000);
    }
</script>

</body>
</html>
