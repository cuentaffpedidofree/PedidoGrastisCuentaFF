<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>REY FANTASMITA - INYECTOR REAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background: #050505; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 400px; margin: auto; border: 1px solid #333; padding: 20px; }
        .console { background: #000; height: 200px; overflow-y: auto; padding: 10px; border: 1px solid #222; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h3>REY FANTASMITA - INYECTOR</h3>
    <input type="file" id="map-file" accept=".zip">
    <button onclick="procesarInyeccion()">INYECTAR SKINS (ROOT)</button>
    <div class="console" id="console"></div>
</div>

<script>
    const logDiv = document.getElementById('console');
    function log(msg) { logDiv.innerHTML += `<div>> ${msg}</div>`; }

    async function procesarInyeccion() {
        const fileInput = document.getElementById('map-file').files[0];
        if(!fileInput) return alert("Sube el ZIP del mapa");

        const zip = await JSZip.loadAsync(fileInput);
        log("Archivo cargado...");

        // Iteramos sobre los archivos .bytes del ZIP
        zip.forEach(async (relativePath, file) => {
            if (relativePath.endsWith(".bytes")) {
                let data = await file.async("arraybuffer");
                let view = new DataView(data);

                // --- ESTA ES LA PARTE DE INYECCIÓN ---
                // Aquí estamos inyectando el ID de skin en el archivo binario
                // Cambiamos el ID (ejemplo: reemplazar ID 0 por ID 1001 - Skin Élite)
                if (view.byteLength > 100) {
                    view.setUint32(64, 1001, true); // Cambia el valor en el offset 64
                    log(`Inyectado ID 1001 en: ${relativePath}`);
                }
                
                zip.file(relativePath, data);
            }
        });

        // Esperamos un segundo para completar la inyección y descargamos
        setTimeout(async () => {
            const content = await zip.generateAsync({type:"blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "Mapa_Modificado_ReyFantasmita.zip";
            a.click();
            log("MAPA LISTO. REEMPLAZA EN DATA.");
        }, 2000);
    }
</script>
</body>
</html>
