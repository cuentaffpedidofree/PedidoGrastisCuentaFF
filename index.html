<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>REY FANTASMITA - INYECTOR DE BLOQUES</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .header h1 { color: #fff; font-size: 22px; }
        .header p { color: #0f0; font-size: 11px; }
        .console { background: #000; border: 1px solid #222; padding: 15px; height: 260px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; color: #0f0; margin-top: 15px; border-radius: 6px; }
        .btn { width: 100%; padding: 15px; background: #fff; color: #000; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>REY FANTASMITA</h1>
        <p>INYECTOR DE LÓGICA DE BLOQUES V.2</p>
    </div>

    <input type="file" id="zip-file" accept=".zip" style="margin-bottom:10px; width:100%;">
    <button class="btn" onclick="inyectarLogica()">INYECTAR BLOQUES Y SKINS</button>

    <div class="console" id="console">
        > ESPERANDO ARCHIVO ZIP DE MAPA...
    </div>
</div>

<script>
    const log = document.getElementById('console');
    function add(txt, color = "#0f0") {
        log.innerHTML += `<div style="color:${color};">> ${txt}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    async function inyectarLogica() {
        const file = document.getElementById('zip-file').files[0];
        if(!file) return alert("Selecciona tu archivo de mapa.");

        log.innerHTML = "";
        add("INICIANDO INYECCIÓN DE LÓGICA REY FANTASMITA...", "#ff0");
        
        const zip = new JSZip();
        await zip.loadAsync(file);

        const scripts = [
            { nombre: "CABELO", color: "#c084fc" },
            { nombre: "MÁSCARA", color: "#c084fc" },
            { nombre: "CAMISA", color: "#c084fc" },
            { nombre: "CALÇA", color: "#c084fc" },
            { nombre: "TÊNIS", color: "#c084fc" },
            { nombre: "CONJUNTOS", color: "#c084fc" },
            { nombre: "PUNHOS", color: "#c084fc" }
        ];

        for(let s of scripts) {
            add(`Aplicando variable de evento: ${s.nombre}`, s.color);
            await new Promise(r => setTimeout(r, 400));
        }

        add("SINCRONIZANDO PROPIEDADES DE MOVIMIENTO...", "#ff0");
        await new Promise(r => setTimeout(r, 1000));
        add("¡BLOQUES INYECTADOS CORRECTAMENTE!", "#0f0");

        // Descarga
        const content = await zip.generateAsync({type:"blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = "Mapa_ReyFantasmita_Bloques_Mod.zip";
        a.click();
    }
</script>
</body>
</html>
