<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FF CREADOR 2 - CONSOLA PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ff4655; --bg: #060913; }
        body { background: var(--bg); color: #00ff41; font-family: 'Share Tech Mono', monospace; padding: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 10px; max-width: 450px; margin: auto; }
        .console { background: black; padding: 15px; height: 200px; overflow-y: auto; border: 1px solid #333; font-size: 12px; margin-top: 10px; text-align: left; }
        .btn { width: 100%; padding: 12px; border: none; background: var(--main); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 10px; background: #0b1120; border: 1px solid #333; color: white; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card" id="main-ui">
    <h2 style="color:var(--main);">FF CREADOR 2 - ACTIVADOR</h2>
    <input type="text" id="ff-id" placeholder="INGRESA TU ID DE FREE FIRE">
    <button class="btn" onclick="iniciarProceso()">INICIAR COMPROBACIÓN</button>
    
    <div class="console" id="log-console">
        > ESPERANDO INSTRUCCIONES...
    </div>
</div>

<script>
    const log = document.getElementById('log-console');

    function escribir(txt, color = "#00ff41") {
        const div = document.createElement('div');
        div.style.color = color;
        div.innerText = "> " + txt;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    async function iniciarProceso() {
        const id = document.getElementById('ff-id').value;
        if(!id) return alert("Ingresa tu ID");

        log.innerHTML = "";
        escribir("INICIANDO SCAN DE ARCHIVOS...");
        await new Promise(r => setTimeout(r, 1000));
        
        escribir("DETECTADO: ProjectData_slot_2.bytes");
        escribir("DETECTADO: ProjectData_slot_2.meta");
        escribir("DETECTADO: UserLevelData_2.bytes");
        await new Promise(r => setTimeout(r, 1000));

        escribir("COMPROBANDO INTEGRIDAD...");
        await new Promise(r => setTimeout(r, 1500));

        // Simulador de errores
        if(Math.random() > 0.5) {
            escribir("ERROR DETECTADO EN: UserLevelData_2.bytes", "#ff4655");
            escribir("REPARANDO ARCHIVO AUTOMÁTICAMENTE...", "#f59e0b");
            await new Promise(r => setTimeout(r, 2000));
            escribir("REPARACIÓN COMPLETADA.");
        }

        escribir("CONECTANDO CON ID: " + id + "...");
        await new Promise(r => setTimeout(r, 1500));
        
        escribir("INYECTANDO PARÁMETROS...");
        escribir("-----------------------------");
        escribir("ESTADO: ACTIVADO CON ÉXITO", "#f59e0b");
        escribir("ARCHIVOS: 3/3 CORRECTOS");
        escribir("SERVIDOR: CONECTADO");
        escribir("-----------------------------");
        escribir("LISTO PARA JUGAR, ENMANUEL.");
    }
</script>
</body>
</html>
