<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas Free Fire & Chat Privado</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }

        h1, h2, h3 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #94a3b8;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover { background-color: #0369a1; }

        .hidden { display: none; }

        .card {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            background-color: #0369a1;
            border-radius: 4px;
            font-size: 11px;
        }

        .badge-region { background-color: #d97706; }

        /* Chat Estilos */
        .chat-box {
            height: 250px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .msg-user {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            align-self: flex-start;
        }

        .msg-admin {
            background-color: #0369a1;
            align-self: flex-end;
        }

        .chat-img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SECCIÓN PÚBLICA -->
    <div id="public-section">
        <h1>Pedir Cuenta Free Fire</h1>

        <form id="request-form">
            <div class="form-group">
                <label for="username">Tu Nombre / Apodo:</label>
                <input type="text" id="username" required placeholder="Ej. Diego">
            </div>

            <div class="form-group">
                <label for="chat-id">Tu ID de Chat Privado (Crea uno o usa tu nombre):</label>
                <input type="text" id="chat-id" required placeholder="Ej. diego123">
            </div>

            <div class="form-group">
                <label for="account-name">Nombre deseado para la cuenta:</label>
                <input type="text" id="account-name" required placeholder="Ej. ProPlayer2026">
            </div>

            <div class="form-group">
                <label for="region">Selecciona la Región:</label>
                <select id="region" required>
                    <option value="Indonesia">Indonesia 🇮🇩</option>
                    <option value="EE.UU. (US)">EE.UU. (US) 🇺🇸</option>
                    <option value="Sudamérica (SAC)">Sudamérica (SAC) 🌎</option>
                    <option value="Europa">Europa 🇪🇺</option>
                    <option value="Brasil">Brasil 🇧🇷</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pack">Tipo de Cuenta / Pack:</label>
                <select id="pack" required>
                    <option value="Pack Indonesia Chetada">Pack Indonesia (Cuenta Chetada)</option>
                    <option value="Pack VIP Exclusivo">Pack VIP Exclusivo</option>
                    <option value="Cuenta Básica Gratis">Cuenta Básica Gratis</option>
                </select>
            </div>

            <button type="submit">Pedir Cuenta</button>
        </form>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- CHAT PRIVADO DEL JUGADOR -->
        <h2>Chat Privado con el Creador</h2>
        <p style="font-size: 11px; color: #94a3b8; text-align: center; margin-bottom: 10px;">
            Ingresa tu ID de Chat para ver solo tus mensajes.
        </p>

        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="user-login-id" placeholder="Ingresa tu ID de Chat">
            <button onclick="openUserChat()" style="width: 40%; margin-top: 0; background-color: #059669;">Entrar</button>
        </div>

        <div id="private-chat-area" class="hidden">
            <div id="user-chat-box" class="chat-box"></div>

            <form id="user-msg-form">
                <input type="text" id="user-msg-input" placeholder="Escribe un mensaje..." required style="margin-bottom: 5px;">
                
                <label style="color: #38bdf8; cursor: pointer; font-size: 12px; display: block; margin-bottom: 5px;">
                    📷 Adjuntar Captura de pantalla
                    <input type="file" id="user-img-input" accept="image/*" style="display: none;" onchange="showFileName(this)">
                </label>
                <span id="file-name" style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 5px;"></span>

                <button type="submit" style="background-color: #0284c7;">Enviar al Creador</button>
            </form>
        </div>

        <span class="admin-link" onclick="showAdminLogin()">Acceso Privado Creador</span>
    </div>

    <!-- SECCIÓN LOGIN CREADOR -->
    <div id="admin-login-section" class="hidden">
        <h2>Panel de Creador</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="admin-user" required placeholder="Usuario">
            </div>
            <div class="form-group">
                <input type="password" id="admin-pass" required placeholder="Contraseña">
            </div>
            <button type="submit">Iniciar Sesión</button>
            <button type="button" onclick="showPublicForm()" style="background-color: #475569;">Volver</button>
        </form>
    </div>

    <!-- PANEL DEL CREADOR (ADMIN) -->
    <div id="admin-panel-section" class="hidden">
        <h2>Panel de Control - Endry</h2>

        <h3>Cuentas Pedidas:</h3>
        <div id="requests-list"></div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <h3>Chats Privados con Jugadores:</h3>
        <div class="form-group">
            <label>Selecciona un Jugador para responder:</label>
            <select id="admin-chat-select" onchange="loadAdminChat()">
                <option value="">-- Selecciona un Chat --</option>
            </select>
        </div>

        <div id="admin-chat-box" class="chat-box"></div>

        <form id="admin-reply-form">
            <input type="text" id="admin-reply-input" placeholder="Responder al jugador..." required style="margin-bottom: 5px;">
            <button type="submit" style="background-color: #d97706;">Enviar Respuesta</button>
        </form>

        <button onclick="logoutAdmin()" style="background-color: #b91c1c; margin-top: 15px;">Cerrar Sesión</button>
    </div>

</div>

<script>
    const ADMIN_USER = "endry";
    const ADMIN_PASS = "1234";
    let activeChatId = "";

    // Navegación
    function showAdminLogin() {
        document.getElementById('public-section').classList.add('hidden');
        document.getElementById('admin-login-section').classList.remove('hidden');
    }

    function showPublicForm() {
        document.getElementById('admin-login-section').classList.add('hidden');
        document.getElementById('admin-panel-section').classList.add('hidden');
        document.getElementById('public-section').classList.remove('hidden');
    }

    // 1. Guardar Solicitud
    document.getElementById('request-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const chatId = document.getElementById('chat-id').value.trim().toLowerCase();

        const newRequest = {
            id: Date.now(),
            user: document.getElementById('username').value,
            chatId: chatId,
            accountName: document.getElementById('account-name').value,
            region: document.getElementById('region').value,
            pack: document.getElementById('pack').value,
            date: new Date().toLocaleString()
        };

        let requests = JSON.parse(localStorage.getItem('ff_requests')) || [];
        requests.push(newRequest);
        localStorage.setItem('ff_requests', JSON.stringify(requests));

        alert("¡Solicitud enviada! Tu ID de chat es: " + chatId);
        document.getElementById('user-login-id').value = chatId;
        openUserChat();
    });

    // 2. Chat Privado del Usuario
    function openUserChat() {
        const idInput = document.getElementById('user-login-id').value.trim().toLowerCase();
        if (!idInput) return alert("Ingresa un ID de chat válido.");

        activeChatId = idInput;
        document.getElementById('private-chat-area').classList.remove('hidden');
        renderPrivateChat();
    }

    function showFileName(input) {
        const fileName = input.files[0] ? input.files[0].name : '';
        document.getElementById('file-name').innerText = fileName ? "Imagen: " + fileName : '';
    }

    document.getElementById('user-msg-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const text = document.getElementById('user-msg-input').value;
        const imgInput = document.getElementById('user-img-input');

        if (imgInput.files && imgInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                saveMessage(activeChatId, text, e.target.result, 'user');
                resetUserForm();
            };
            reader.readAsDataURL(imgInput.files[0]);
        } else {
            saveMessage(activeChatId, text, null, 'user');
            resetUserForm();
        }
    });

    function resetUserForm() {
        document.getElementById('user-msg-input').value = '';
        document.getElementById('user-img-input').value = '';
        document.getElementById('file-name').innerText = '';
        renderPrivateChat();
    }

    function saveMessage(chatId, text, image, sender) {
        let chats = JSON.parse(localStorage.getItem('ff_private_chats')) || {};
        if (!chats[chatId]) chats[chatId] = [];

        chats[chatId].push({ text, image, sender, date: new Date().toLocaleTimeString() });
        localStorage.setItem('ff_private_chats', JSON.stringify(chats));
    }

    function renderPrivateChat() {
        let chats = JSON.parse(localStorage.getItem('ff_private_chats')) || {};
        const chatBox = document.getElementById('user-chat-box');
        const list = chats[activeChatId] || [];

        chatBox.innerHTML = list.length === 0 ? '<p style="font-size:12px; color:#64748b;">No hay mensajes en este chat.</p>' : '';

        list.forEach(m => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${m.sender === 'admin' ? 'msg-admin' : 'msg-user'}`;
            msgDiv.innerHTML = `<strong>${m.sender === 'admin' ? 'Creador' : 'Tú'}:</strong> ${m.text}`;
            if (m.image) {
                msgDiv.innerHTML += `<br><img src="${m.image}" class="chat-img"/>`;
            }
            chatBox.appendChild(msgDiv);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 3. Panel de Administrador (Endry)
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        if (document.getElementById('admin-user').value === ADMIN_USER && document.getElementById('admin-pass').value === ADMIN_PASS) {
            document.getElementById('admin-login-section').classList.add('hidden');
            document.getElementById('admin-panel-section').classList.remove('hidden');
            loadAdminData();
        } else {
            alert("Credenciales incorrectas");
        }
    });

    function loadAdminData() {
        // Cargar Solicitudes
        const requestsList = document.getElementById('requests-list');
        let requests = JSON.parse(localStorage.getItem('ff_requests')) || [];
        requestsList.innerHTML = requests.length === 0 ? '<p style="font-size:12px; color:#64748b;">Sin solicitudes.</p>' : '';

        requests.forEach(req => {
            requestsList.innerHTML += `
                <div class="card">
                    <p><strong>Jugador:</strong> ${req.user} (ID Chat: ${req.chatId})</p>
                    <p><strong>Cuenta:</strong> ${req.accountName}</p>
                    <p><strong>Región:</strong> <span class="badge badge-region">${req.region}</span></p>
                    <p><strong>Pack:</strong> <span class="badge">${req.pack}</span></p>
                </div>
            `;
        });

        // Cargar Lista de Chats en el Dropdown
        const select = document.getElementById('admin-chat-select');
        let chats = JSON.parse(localStorage.getItem('ff_private_chats')) || {};
        select.innerHTML = '<option value="">-- Selecciona un Chat --</option>';

        Object.keys(chats).forEach(chatId => {
            select.innerHTML += `<option value="${chatId}">Chat ID: ${chatId}</option>`;
        });
    }

    function loadAdminChat() {
        const chatId = document.getElementById('admin-chat-select').value;
        const box = document.getElementById('admin-chat-box');
        if (!chatId) return box.innerHTML = '';

        let chats = JSON.parse(localStorage.getItem('ff_private_chats')) || {};
        const list = chats[chatId] || [];

        box.innerHTML = '';
        list.forEach(m => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${m.sender === 'admin' ? 'msg-admin' : 'msg-user'}`;
            msgDiv.innerHTML = `<strong>${m.sender === 'admin' ? 'Tú' : 'Jugador'}:</strong> ${m.text}`;
            if (m.image) {
                msgDiv.innerHTML += `<br><img src="${m.image}" class="chat-img"/>`;
            }
            box.appendChild(msgDiv);
        });
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('admin-reply-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const chatId = document.getElementById('admin-chat-select').value;
        const text = document.getElementById('admin-reply-input').value;

        if (!chatId) return alert("Selecciona un chat primero.");

        saveMessage(chatId, text, null, 'admin');
        document.getElementById('admin-reply-input').value = '';
        loadAdminChat();
    });

    function logoutAdmin() {
        document.getElementById('admin-panel-section').classList.add('hidden');
        showPublicForm();
    }
</script>

</body>
</html>
